worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;
    gzip_types    text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # ── Rate limiting ────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;

    # ── HTTP → HTTPS redirect ────────────────────────────────
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── Main HTTPS server ────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name omniiq.tech www.omniiq.tech;

        ssl_certificate     /etc/letsencrypt/live/omniiq.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/omniiq.tech/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";

        # ── Landing page (/) ─────────────────────────────────
        location = / {
            root /usr/share/nginx/landing;
            try_files /index.html =404;
        }

        location ~* \.(html|css|js|svg|ico|png|jpg|webp|woff2?)$ {
            root /usr/share/nginx/landing;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # ── API (/api/*) ─────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=10 nodelay;

            proxy_pass         http://api:8000/api/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # ── API docs (/docs, /redoc) ─────────────────────────
        location ~ ^/(docs|redoc|openapi.json) {
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
        }

        # ── Dashboard (/app/*) ───────────────────────────────
        location /app {
            proxy_pass         http://web:3000;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade     $http_upgrade;
            proxy_set_header   Connection  "upgrade";
            proxy_set_header   Host        $host;
            proxy_cache_bypass $http_upgrade;
        }

        # ── Next.js static assets ─────────────────────────────
        location /_next/ {
            proxy_pass http://web:3000/_next/;
            expires    1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
